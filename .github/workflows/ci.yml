name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - name: Lint
        run: ruff check

      - name: Test
        run: pytest

  hermes:
    # The end-to-end tests load the plugin through a real Hermes and are skipped above. Hermes changes
    # quickly; this job runs them against its current main so a renamed hook, tool or module shows here.
    name: Against Hermes main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent

      - uses: astral-sh/setup-uv@v6

      - name: Install Hermes
        working-directory: hermes-agent
        run: |
          uv sync --locked --python 3.14 --group dev
          uv pip install --python .venv/bin/python pyyaml

      - name: Test
        run: PYTHONPATH=hermes-agent hermes-agent/.venv/bin/python -m pytest -p no:cacheprovider tests
